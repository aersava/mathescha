<svg viewBox="0 0 460 250" width="100%" style="max-width: 460px; display: block; margin: 14px 0; font-family: inherit;">
  <!-- Вертикальные пунктирные линии сетки -->
  <g stroke="currentColor" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4,4">
    <line x1="60" y1="30" x2="60" y2="175" />
    <line x1="110" y1="30" x2="110" y2="175" />
    <line x1="210" y1="30" x2="210" y2="175" />
    <line x1="260" y1="30" x2="260" y2="175" />
    <line x1="310" y1="30" x2="310" y2="175" />
    <line x1="360" y1="30" x2="360" y2="175" />
    <line x1="410" y1="30" x2="410" y2="175" />
  </g>

  <!-- Оси X и Y -->
  <g stroke="currentColor" stroke-width="1.5">
    <!-- Ось X -->
    <line x1="30" y1="175" x2="435" y2="175" />
    <polygon points="435,175 426,171 426,179" fill="currentColor" />
    <!-- Ось Y (f(x)) -->
    <line x1="160" y1="205" x2="160" y2="22" />
    <polygon points="160,22 156,31 164,31" fill="currentColor" />
  </g>

  <!-- График функции плотности (трапеция) -->
  <polyline points="60,175 160,95 310,95 410,175" fill="none" stroke="#c85a32" stroke-width="3" stroke-linejoin="round" />

  <!-- Подписи осей и областей -->
  <g fill="currentColor" font-size="14">
    <text x="170" y="32" font-weight="bold">f(x)</text>
    <text x="430" y="163" font-weight="bold">x</text>
    <text x="168" y="142">h</text>
    <text x="85" y="65" text-anchor="middle">zu früh</text>
    <text x="235" y="65" text-anchor="middle">zu spät</text>
  </g>

  <!-- Подписи по оси X (числа от -2 до 5) -->
  <g fill="currentColor" font-size="13" text-anchor="middle">
    <text x="60" y="195">-2</text>
    <text x="110" y="195">-1</text>
    <text x="150" y="195">0</text>
    <text x="210" y="195">1</text>
    <text x="260" y="195">2</text>
    <text x="310" y="195">3</text>
    <text x="360" y="195">4</text>
    <text x="410" y="195">5</text>
  </g>

  <!-- Нижний ряд: время (8^58 - 9^05) -->
  <g fill="currentColor" font-size="12" text-anchor="middle" opacity="0.85">
    <text x="60" y="225">8<tspan dy="-5" font-size="9">58</tspan></text>
    <text x="110" y="225">8<tspan dy="-5" font-size="9">59</tspan></text>
    <text x="160" y="225">9<tspan dy="-5" font-size="9">00</tspan></text>
    <text x="210" y="225">9<tspan dy="-5" font-size="9">01</tspan></text>
    <text x="260" y="225">9<tspan dy="-5" font-size="9">02</tspan></text>
    <text x="310" y="225">9<tspan dy="-5" font-size="9">03</tspan></text>
    <text x="360" y="225">9<tspan dy="-5" font-size="9">04</tspan></text>
    <text x="410" y="225">9<tspan dy="-5" font-size="9">05</tspan></text>
  </g>
</svg>
